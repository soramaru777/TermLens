<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TermLens — 会議用語リアルタイム解説</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e7a6f">
</head>
<body>
  <!-- ホーム画面 -->
  <section id="home">
    <header class="screen-header">
      <h1>TermLens</h1>
      <button id="open-settings" class="icon-btn" aria-label="設定を開く">⚙</button>
    </header>

    <div class="home-body">
      <p class="sub">会議の会話をリアルタイムに文字起こしし、専門用語を自動解説します。</p>
      <button id="start-btn" class="primary">開始</button>
      <p id="home-error" class="error" hidden></p>
    </div>

    <footer class="home-footer">
      <button id="glossary-row" class="row-link">
        <span>用語集</span>
        <span class="row-value"><span id="glossary-count">0語</span> ›</span>
      </button>
      <p id="home-info" class="info"></p>
    </footer>
  </section>

  <!-- 設定画面 -->
  <section id="settings" hidden>
    <header class="screen-header">
      <button id="close-settings" class="back-btn" aria-label="戻る">‹ 戻る</button>
      <h2>設定</h2>
    </header>

    <div class="settings-body">
      <label for="token">アクセストークン</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="共有トークン(ローカル開発では空でOK)">
      <p class="hint">この端末にのみ保存されます。</p>

      <label for="glossary">用語集(1行に1語)</label>
      <textarea id="glossary" rows="10" placeholder="例)&#10;田中太郎&#10;Kubernetes&#10;RAG"></textarea>
      <p class="hint">参加者名・社名・専門用語を入れると、音声認識の段階で精度が上がります。</p>

      <button id="save-settings" class="primary">保存</button>
    </div>
  </section>

  <!-- 本番画面 -->
  <section id="live" hidden>
    <header>
      <span id="status-badge" class="badge">接続中…</span>
      <button id="stop-btn">停止</button>
    </header>
    <!-- 停止するまで非表示。停止後にダウンロード手段を出す -->
    <div id="export-row" hidden>
      <button id="dl-transcript" class="export-btn">⬇ 文字起こし.md</button>
      <button id="dl-terms" class="export-btn">⬇ 用語カード.md</button>
    </div>
    <div id="transcript" aria-label="文字起こし">
      <div id="final-text"></div>
      <div id="interim-text"></div>
    </div>
    <div id="cards" aria-label="用語カード"></div>
  </section>

  <script src="/app.js" type="module"></script>
</body>
</html>
