<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TermLens — 会議用語リアルタイム解説</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e7a6f">
</head>
<body>
  <!-- ホーム画面 -->
  <section id="home">
    <header class="screen-header">
      <h1>TermLens</h1>
      <button id="open-settings" class="icon-btn" aria-label="設定を開く">⚙</button>
    </header>

    <div class="home-body">
      <!-- 前回セッションが localStorage に残っている場合だけ表示する(要件3) -->
      <div id="restore-banner" class="restore-banner" hidden>
        <p id="restore-info"></p>
        <p class="hint">「開始」で新しい会議を始めると、この内容は破棄されます。</p>
        <div class="restore-actions">
          <button id="restore-btn" class="primary">復元する</button>
          <button id="discard-btn" class="secondary">破棄する</button>
        </div>
      </div>
      <p class="sub">会議の会話をリアルタイムに文字起こしし、専門用語を自動解説します。</p>
      <button id="start-btn" class="primary">開始</button>
      <p id="home-error" class="error" hidden></p>
    </div>

    <footer class="home-footer">
      <!-- 収音モードはホームに常時出す。設定画面を開かないと分からないと、
           前回スピーカー収音で使った設定のまま対面会議を始めてしまう(#26) -->
      <button id="capture-mode-row" class="row-link">
        <span>収音モード</span>
        <span class="row-value"><span id="capture-mode-current"></span> ›</span>
      </button>
      <button id="glossary-row" class="row-link">
        <span>用語集</span>
        <span class="row-value"><span id="glossary-count">0語</span> ›</span>
      </button>
      <p id="home-info" class="info"></p>
    </footer>
  </section>

  <!-- 設定画面 -->
  <section id="settings" hidden>
    <header class="screen-header">
      <button id="close-settings" class="back-btn" aria-label="戻る">‹ 戻る</button>
      <h2>設定</h2>
    </header>

    <div class="settings-body">
      <label for="token">アクセストークン</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="共有トークン(ローカル開発では空でOK)">
      <p class="hint">この端末にのみ保存されます。</p>

      <label for="glossary">用語集(1行に1語)</label>
      <textarea id="glossary" rows="10" placeholder="例)&#10;田中太郎&#10;Kubernetes&#10;RAG"></textarea>
      <p class="hint">参加者名・社名・専門用語を入れると、音声認識の段階で精度が上がります。</p>

      <label for="capture-mode">収音モード</label>
      <!-- 選択肢は capture-mode.js の CAPTURE_MODES から app.js が組み立てる
           (ここに文言を書き写すと定義が2箇所になる) -->
      <select id="capture-mode"></select>
      <p id="capture-mode-hint" class="hint"></p>

      <label class="checkbox-row"><input id="persist-toggle" type="checkbox"> 会議の内容をこの端末に保存する</label>
      <p class="hint">音声は保存されません。保存から24時間で自動的に削除されます。</p>

      <button id="save-settings" class="primary">保存</button>
    </div>
  </section>

  <!-- 本番画面 -->
  <section id="live" hidden>
    <header>
      <span id="status-badge" class="badge">接続中…</span>
      <button id="stop-btn">停止</button>
    </header>
    <!-- 停止するまで非表示。停止後にダウンロード手段を出す -->
    <div id="export-row" hidden>
      <button id="dl-transcript" class="export-btn">⬇ 文字起こし.md</button>
      <button id="dl-terms" class="export-btn">⬇ 用語カード.md</button>
      <!-- 診断は独立したファイルにする。実機比較の結果を共有するときに、
           会話本文を含むファイルを渡さずに済むため(#26) -->
      <button id="dl-diagnostics" class="export-btn">⬇ 収音診断.md</button>
    </div>
    <!-- 収音診断(#26)。既定は畳んでおき、会議中の表示を邪魔しない -->
    <details id="diag-panel" hidden>
      <summary id="diag-summary">収音診断</summary>
      <table id="diag-table"></table>
    </details>
    <div id="transcript" aria-label="文字起こし">
      <div id="final-text"></div>
      <div id="interim-text"></div>
    </div>
    <!-- 縦積みレイアウト(スマホ)専用。横並びでは全カードが見えるため非表示 -->
    <div id="card-nav" hidden>
      <span id="card-position"></span>
      <button id="latest-btn" type="button">最新</button>
    </div>
    <div id="cards" aria-label="用語カード"></div>
  </section>

  <script src="/app.js" type="module"></script>
</body>
</html>
