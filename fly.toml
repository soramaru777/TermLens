app = "termlens"
primary_region = "nrt"

[build]

[env]
  STT_PROVIDER = "deepgram"
  ANTHROPIC_MODEL = "claude-opus-4-8"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
