app = "termlens-tatsu"
primary_region = "nrt"

[build]

[env]
  STT_PROVIDER = "deepgram"
  LLM_MODEL = "gpt-5.6-luna"

[http_service]
  internal_port = 8080
  force_https = true
  # "stop" だとアイドル後の初回アクセスでマシンの起動を待たされる(実測7.2秒)。
  # "suspend" はメモリを保存して再開するため実測0.39秒。停止中の課金は
  # stop と同じ(rootfs のみ。CPU・RAM は課金されない)ので、速度だけが変わる。
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
